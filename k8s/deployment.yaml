apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-ml
spec:
  replicas: 2
  selector:
    matchLabels: {app: delivery-ml}
  template:
    metadata: {labels: {app: delivery-ml}}
    spec:
      containers:
        - name: delivery-ml
          image: delivery-mlops:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-ml
spec:
  selector: {app: delivery-ml}
  ports: [{port: 8501, targetPort: 8501}]
  type: NodePort
